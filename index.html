<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRS Audit Assistant - KNI Healthcare</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        /* PIN Screen */
        .pin-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f0f 100%);
        }

        .pin-screen.hidden {
            display: none;
        }

        .pin-container {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 320px;
            width: 90%;
        }

        .pin-container h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .pin-container p {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 24px;
        }

        .pin-input {
            width: 100%;
            padding: 16px;
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 8px;
            background: #2a2a2a;
            border: 2px solid #333;
            border-radius: 8px;
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }

        .pin-input:focus {
            border-color: #4f46e5;
        }

        .pin-input.error {
            border-color: #ef4444;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .pin-error {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 12px;
            height: 20px;
        }

        /* Chat Screen */
        .chat-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
        }

        .chat-screen.active {
            display: flex;
        }

        /* Header */
        .chat-header {
            background: #1a1a1a;
            padding: 16px 20px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .header-text h2 {
            font-size: 1rem;
            font-weight: 600;
        }

        .header-text span {
            font-size: 0.75rem;
            color: #10b981;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .header-btn {
            background: #2a2a2a;
            border: none;
            color: #888;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .header-btn:hover {
            background: #333;
            color: #fff;
        }

        /* Messages Area */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
        }

        .message.user .message-avatar {
            background: #2a2a2a;
        }

        .message-content {
            background: #1e1e1e;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .message.user .message-content {
            background: #4f46e5;
        }

        .message-content p {
            margin-bottom: 8px;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        .message-content ul, .message-content ol {
            margin: 8px 0;
            padding-left: 20px;
        }

        .message-content li {
            margin-bottom: 4px;
        }

        .message-content code {
            background: #2a2a2a;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', Consolas, monospace;
            font-size: 0.85rem;
        }

        .message-content pre {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .message-content pre code {
            background: none;
            padding: 0;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            gap: 12px;
            max-width: 85%;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dots {
            background: #1e1e1e;
            padding: 16px 20px;
            border-radius: 12px;
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            background: #666;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.8); }
            40% { transform: scale(1.2); }
        }

        /* Input Area */
        .input-container {
            padding: 16px 20px;
            background: #1a1a1a;
            border-top: 1px solid #2a2a2a;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 0.95rem;
            resize: none;
            max-height: 120px;
            line-height: 1.4;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #4f46e5;
        }

        .input-field::placeholder {
            color: #666;
        }

        .send-btn {
            background: #4f46e5;
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .send-btn:hover {
            background: #4338ca;
            transform: scale(1.05);
        }

        .send-btn:disabled {
            background: #333;
            cursor: not-allowed;
            transform: none;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Welcome Message */
        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }

        .welcome-message h3 {
            color: #fff;
            margin-bottom: 8px;
            font-size: 1.2rem;
        }

        .welcome-message p {
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .quick-action {
            background: #1e1e1e;
            border: 1px solid #333;
            color: #fff;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .quick-action:hover {
            background: #2a2a2a;
            border-color: #4f46e5;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .message {
                max-width: 95%;
            }

            .header-text h2 {
                font-size: 0.9rem;
            }

            .quick-actions {
                flex-direction: column;
            }

            .quick-action {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- PIN Screen -->
    <div class="pin-screen" id="pinScreen">
        <div class="pin-container">
            <h1>🔒 IRS Audit Assistant</h1>
            <p>Enter PIN to continue</p>
            <input 
                type="password" 
                class="pin-input" 
                id="pinInput" 
                maxlength="6" 
                placeholder="••••••"
                autocomplete="off"
            >
            <div class="pin-error" id="pinError"></div>
        </div>
    </div>

    <!-- Chat Screen -->
    <div class="chat-screen" id="chatScreen">
        <div class="chat-header">
            <div class="header-info">
                <div class="header-icon">🤖</div>
                <div class="header-text">
                    <h2>IRS Audit Assistant</h2>
                    <span>● Online</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="header-btn" onclick="clearChat()">Clear chat</button>
                <button class="header-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="welcome-message" id="welcomeMessage">
                <h3>👋 Hi! I'm your IRS Audit Assistant</h3>
                <p>I can help you with financial information for KNI and NPOC</p>
                <div class="quick-actions">
                    <button class="quick-action" onclick="sendQuickMessage('Are we ready for an IRS audit?')">
                        Are we audit-ready?
                    </button>
                    <button class="quick-action" onclick="sendQuickMessage('What is the current P&L summary?')">
                        P&L Summary
                    </button>
                    <button class="quick-action" onclick="sendQuickMessage('Which transactions need documentation?')">
                        Pending documentation
                    </button>
                </div>
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typingIndicator">
                <div class="message-avatar">🤖</div>
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <textarea 
                    class="input-field" 
                    id="messageInput" 
                    placeholder="Type your question..." 
                    rows="1"
                ></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURATION - EDIT THESE VALUES
        // ============================================
        const CONFIG = {
            PIN: '123456',  // Change this to your desired PIN
            WEBHOOK_URL: 'https://googlen8n.freedynamicdns.org/webhook/irs-chat',  // Paste your n8n webhook URL here
            COMPANY: 'K&I Healthcare'
        };
        // ============================================

        // State
        let chatHistory = [];
        const STORAGE_KEY = 'irs_audit_chat_history';
        const AUTH_KEY = 'irs_audit_authenticated';

        // DOM Elements
        const pinScreen = document.getElementById('pinScreen');
        const chatScreen = document.getElementById('chatScreen');
        const pinInput = document.getElementById('pinInput');
        const pinError = document.getElementById('pinError');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const welcomeMessage = document.getElementById('welcomeMessage');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Check if already authenticated
            if (sessionStorage.getItem(AUTH_KEY) === 'true') {
                showChat();
            }

            // Load chat history
            loadChatHistory();

            // PIN input handler
            pinInput.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') {
                    checkPin();
                }
                // Auto-submit when 6 digits entered
                if (pinInput.value.length === 6) {
                    checkPin();
                }
            });

            // Message input handlers
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            messageInput.addEventListener('input', autoResize);
        });

        function checkPin() {
            if (pinInput.value === CONFIG.PIN) {
                sessionStorage.setItem(AUTH_KEY, 'true');
                showChat();
            } else {
                pinInput.classList.add('error');
                pinError.textContent = 'Incorrect PIN';
                setTimeout(() => {
                    pinInput.classList.remove('error');
                    pinInput.value = '';
                }, 500);
            }
        }

        function showChat() {
            pinScreen.classList.add('hidden');
            chatScreen.classList.add('active');
            messageInput.focus();
        }

        function logout() {
            sessionStorage.removeItem(AUTH_KEY);
            location.reload();
        }

        function loadChatHistory() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                chatHistory = JSON.parse(saved);
                if (chatHistory.length > 0) {
                    welcomeMessage.style.display = 'none';
                    chatHistory.forEach(msg => {
                        appendMessage(msg.role, msg.content, false);
                    });
                    scrollToBottom();
                }
            }
        }

        function saveChatHistory() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
        }

        function clearChat() {
            if (confirm('Clear all chat history?')) {
                chatHistory = [];
                localStorage.removeItem(STORAGE_KEY);
                messagesContainer.innerHTML = `
                    <div class="welcome-message" id="welcomeMessage">
                        <h3>👋 Hi! I'm your IRS Audit Assistant</h3>
                        <p>I can help you with financial information for KNI and NPOC</p>
                        <div class="quick-actions">
                            <button class="quick-action" onclick="sendQuickMessage('Are we ready for an IRS audit?')">
                                Are we audit-ready?
                            </button>
                            <button class="quick-action" onclick="sendQuickMessage('What is the current P&L summary?')">
                                P&L Summary
                            </button>
                            <button class="quick-action" onclick="sendQuickMessage('Which transactions need documentation?')">
                                Pending documentation
                            </button>
                        </div>
                    </div>
                    <div class="typing-indicator" id="typingIndicator">
                        <div class="message-avatar">🤖</div>
                        <div class="typing-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                `;
            }
        }

        function sendQuickMessage(text) {
            messageInput.value = text;
            sendMessage();
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // Hide welcome message
            const welcome = document.getElementById('welcomeMessage');
            if (welcome) welcome.style.display = 'none';

            // Add user message
            appendMessage('user', message);
            chatHistory.push({ role: 'user', content: message });
            saveChatHistory();

            // Clear input
            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendBtn.disabled = true;

            // Show typing indicator
            showTyping(true);

            try {
                const response = await fetch(CONFIG.WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain',
                    },
                    body: JSON.stringify({
                        message: message,
                        history: chatHistory.slice(-10), // Last 10 messages for context
                        timestamp: new Date().toISOString()
                    })
                });

                if (!response.ok) throw new Error('Network error');

                const data = await response.json();
                const assistantMessage = data.response || data.message || 'Sorry, I could not process your request.';

                // Add assistant message
                appendMessage('assistant', assistantMessage);
                chatHistory.push({ role: 'assistant', content: assistantMessage });
                saveChatHistory();

            } catch (error) {
                console.error('Error:', error);
                const errorMsg = 'Sorry, there was a connection error. Please try again.';
                appendMessage('assistant', errorMsg);
            }

            showTyping(false);
            sendBtn.disabled = false;
            messageInput.focus();
        }

        function appendMessage(role, content, animate = true) {
            const typingEl = document.getElementById('typingIndicator');
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            if (!animate) messageDiv.style.animation = 'none';

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = role === 'assistant' ? '🤖' : '👤';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = formatMessage(content);

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);

            // Insert before typing indicator
            messagesContainer.insertBefore(messageDiv, typingEl);
            scrollToBottom();
        }

        function formatMessage(text) {
            // Basic markdown-like formatting
            return text
                // Code blocks
                .replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                // Inline code
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                // Bold
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                // Italic
                .replace(/\*([^*]+)\*/g, '<em>$1</em>')
                // Line breaks
                .replace(/\n/g, '<br>')
                // Lists (simple)
                .replace(/^- (.+)$/gm, '• $1');
        }

        function showTyping(show) {
            const typingEl = document.getElementById('typingIndicator');
            typingEl.classList.toggle('active', show);
            if (show) scrollToBottom();
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function autoResize() {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
        }
    </script>
</body>
</html>
